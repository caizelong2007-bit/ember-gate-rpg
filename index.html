  if(enemyAction&&p>.3&&p<.78){const heavy=key==='enemy_heavy';glow(300,390,Math.sin((p-.3)/.48*Math.PI)*(heavy?190:110),heavy?'#ff986577':'#f3c7a344');if(heavy){ctx.strokeStyle='#ffb67daa';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(300,465,150*p,45*p,0,0,Math.PI*2);ctx.stroke();}}
  ctx.setTransform(w/1100,0,0,h/619,0,0);
  if(key==='defeat'){ctx.fillStyle='#0a1420aa';ctx.fillRect(0,0,1100,619);}
  requestAnimationFrame(draw);
}
async function loadVideoLibrary(){
  if(location.protocol==='file:')return;
  try{
    const manifestURL=new URL('./assets/videos.json',document.baseURI);
    const response=await fetch(manifestURL,{cache:'no-cache'});
    if(!response.ok)return;
    const manifest=await response.json();
    for(const [key,item] of Object.entries(manifest.clips||{})){
      if(!(key in MEDIA)||!item||typeof item.src!=='string')continue;
      const url=new URL(item.src,manifestURL);
      if(url.origin!==location.origin)continue;
      clips.set(key,url.href);
      if(typeof item.impact==='number'&&Number.isFinite(item.impact))MEDIA[key].impact=clamp(item.impact,.05,.95);
    }
    if(state.phase==='player'&&clips.has('idle'))showIdle();
  }catch(error){console.warn('Video library unavailable; using the playable fallback.');}
}
reset();requestAnimationFrame(draw);loadVideoLibrary();
</script>
